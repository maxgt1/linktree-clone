<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dyad-generated-app</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener("message", function (event) {
        if (event.data && event.data.type === "dyad-take-screenshot") {
          var requestId = event.data.requestId;
          var element = document.getElementById("root");

          if (!element) {
            window.postMessage(
              {
                type: "dyad-screenshot-response",
                requestId: requestId,
                success: false,
                error: "Root element not found",
              },
              "*",
            );
            return;
          }

          try {
            var canvas = document.createElement("canvas");
            canvas.width = element.offsetWidth || 800;
            canvas.height = element.offsetHeight || 600;
            var ctx = canvas.getContext("2d");

            if (ctx) {
              ctx.fillStyle = "#f0f0f0";
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.fillStyle = "#333";
              ctx.font = "14px Arial";
              ctx.fillText(
                "Screenshot captured at " + new Date().toLocaleTimeString(),
                20,
                30,
              );
            }

            var dataUrl = canvas.toDataURL("image/png");

            window.postMessage(
              {
                type: "dyad-screenshot-response",
                requestId: requestId,
                success: true,
                dataUrl: dataUrl,
              },
              "*",
            );
          } catch (err) {
            window.postMessage(
              {
                type: "dyad-screenshot-response",
                requestId: requestId,
                success: false,
                error: err.message || "Screenshot capture failed",
              },
              "*",
            );
          }
        }
      });
    </script>
  </body>
</html>
